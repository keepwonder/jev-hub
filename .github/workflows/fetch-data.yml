name: Fetch Data

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:        # manual trigger
  push:
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Install Playwright
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Fetch X discussions
        working-directory: site
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
        run: npm run fetch:x

      - name: Fetch HN discussions
        working-directory: site
        run: npm run fetch:hn

      - name: Refresh GitHub stars
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:github

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): refresh aggregated content"
            git push
          fi
