name: Fetch Data

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:        # manual trigger
  push:
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Repo root IS the site directory (git was initialized inside site/),
      # so package.json etc. live at the repo root — no `site/` prefix.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'   # Node 22 LTS (Node 20 已 EOL)
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Detect cookie presence at job START so the steps below can use it
      - name: Detect X cookies
        id: cookies
        run: |
          if [ -n "${{ secrets.X_COOKIES_JSON }}" ]; then
            echo "HAS_X_COOKIES=true" >> $GITHUB_ENV
            echo "✅ X_COOKIES_JSON set — X scraper will run"
          else
            echo "HAS_X_COOKIES=false" >> $GITHUB_ENV
            echo "⚠️ X_COOKIES_JSON not set — skipping X scraper (X data won't auto-update)"
          fi

      # Install Playwright + Chromium only when X cookies are configured
      - name: Install Playwright (for X scraper)
        if: ${{ env.HAS_X_COOKIES == 'true' }}
        run: npx playwright install --with-deps chromium

      # Fetch GitHub stars (always runs — uses 1 API call per refresh)
      - name: Refresh GitHub stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:github

      # Fetch HN discussions (always runs — uses 1 API call per query)
      - name: Fetch HN discussions
        run: npm run fetch:hn

      # Fetch X discussions (skipped if no cookies) — incremental merge +
      # metric refresh, so existing posts keep their engagement numbers fresh
      # and new posts are appended (instead of overwriting the file).
      - name: Fetch X discussions
        if: ${{ env.HAS_X_COOKIES == 'true' }}
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
        run: npm run fetch:x
        continue-on-error: true

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): refresh aggregated content [skip ci]"
            git push
          fi
